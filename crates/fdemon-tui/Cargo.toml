[package]
name = "fdemon-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal UI for Flutter Demon"

[features]
# Rebrand title surfaces as "Fdemon PRO" (gold). Enabled only by the pro repo.
pro = []

[dependencies]
fdemon-core.workspace = true
fdemon-app.workspace = true
ratatui.workspace = true
crossterm.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
dirs.workspace = true
unicode-width = "0.2"
qrcode.workspace = true
tui-qrcode.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-util.workspace = true
insta.workspace = true
serial_test.workspace = true
fdemon-daemon = { workspace = true, features = ["test-helpers"] }
