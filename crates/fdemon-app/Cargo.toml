[package]
name = "fdemon-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Application state and orchestration for Flutter Demon"

[dependencies]
fdemon-core.workspace = true
fdemon-daemon.workspace = true
fdemon-dap.workspace = true
# ratatui types appear in the out-of-tree DevTools panel seam
# (`devtools_panel_provider`): a registered panel renders into a ratatui
# `Buffer`/`Rect`. fdemon-app stays otherwise terminal-library-independent; the
# headless/MCP paths simply register no panels, so this dep is inert there.
ratatui.workspace = true
tokio.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
regex.workspace = true
rand.workspace = true
color-eyre.workspace = true
toml.workspace = true
toml_edit.workspace = true
dirs.workspace = true
fs2.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
trait-variant.workspace = true
tempfile.workspace = true
# `wayland-data-control` adds arboard's native Wayland clipboard backend
# (via wl-clipboard-rs). Without it, arboard falls back to X11/XWayland on
# Wayland sessions, where set_text() succeeds but the copied text never
# reaches the Wayland clipboard. `image-data` stays off to avoid the heavy
# `image` dependency — only text copy is needed.
arboard = { version = "3", default-features = false, features = [
    "wayland-data-control",
] }
textwrap = { version = "0.16", default-features = false }
# Display-width math shared by the log-view renderer (fdemon-tui) and the
# drag-selection cell→char mapping (log_view_state) — both must wrap identically.
unicode-width = "0.2"
base64.workspace = true
reqwest.workspace = true
tokio-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-test.workspace = true
mockall.workspace = true
serial_test.workspace = true
fdemon-daemon = { workspace = true, features = ["test-helpers"] }
wiremock.workspace = true
