[workspace]
members = ["crates/*"]
exclude = ["website"]
resolver = "2"

[workspace.package]
version = "0.6.2"
edition = "2021"
license = "BSL-1.1"
# Minimum Rust version required for safe .bat/.cmd invocation via Command::new(path)
# (CVE-2024-24576 fix landed in 1.77.2).
rust-version = "1.77.2"

[profile.release]
codegen-units = 1 # Allows compiler to perform better optimization.
lto = true # Enables Link-time Optimization.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
strip = true # Ensures debug symbols are removed.

[workspace.dependencies]
# Internal crate dependencies
fdemon-core = { path = "crates/fdemon-core" }
fdemon-daemon = { path = "crates/fdemon-daemon" }
fdemon-app = { path = "crates/fdemon-app" }
fdemon-tui = { path = "crates/fdemon-tui" }
fdemon-dap = { path = "crates/fdemon-dap" }

# Shared external dependencies (deduplicate versions)
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
tracing-appender = "0.2"
thiserror = "2"
regex = "1"
color-eyre = "0.6"

# TUI-specific
ratatui = { version = "0.30", features = ["all-widgets"] }
crossterm = "0.29"

# Config
toml = "0.8"
# Format-preserving TOML editing for in-place settings writes (keeps user
# comments, key order, and unmodelled keys when persisting changed values).
toml_edit = "0.22"
dirs = "5"
fs2 = "0.4"
# fs4: cross-platform free-disk-space probe (statvfs/GetDiskFreeSpaceExW).
# v1.x has only 2 direct deps (rustix, windows-sys); no libc, pure-Rust.
fs4 = "1"

# Async
trait-variant = "0.1"
notify = "7"
notify-debouncer-full = "0.4"
tokio-tungstenite = "0.26"
futures-util = "0.3"
tokio-util = { version = "0.7" }

# CLI
clap = { version = "4", features = ["derive"] }

# URL parsing
url = "2"
percent-encoding = "2"

# Process/path utilities
which = "8"
dunce = "1"

# HTTP client (HTTPS-capable, used by version_check and install)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Archive handling for Flutter SDK install (pure-Rust only; no C dependencies)
# zip v2.x: MSRV 1.73.0 — compatible with our 1.77.2 floor.
# default-features = false avoids bzip2/zstd/time; `deflate` enables pure-Rust flate2 backend.
zip = { version = "2", default-features = false, features = ["deflate"] }
# tar: pure-Rust tar reader/writer. `default-features = false` drops xattr (Linux-only optional dep).
tar = { version = "0.4", default-features = false }
# lzma-rs: pure-Rust LZMA/XZ decoder (no liblzma C dependency).
lzma-rs = { version = "0.3", features = ["stream"] }
# sha2: pure-Rust SHA-256 for archive checksum verification.
sha2 = "0.10"

# mDNS service discovery for ADB wireless QR pairing (pure Rust, no system daemon)
mdns-sd = "0.20"
# QR code generation + ratatui widget for the ADB pairing QR display.
# default-features = false on qrcode drops the image/SVG renderers.
qrcode = { version = "0.14", default-features = false }
tui-qrcode = { version = "0.2.4", default-features = false }

# Misc
rand = "0.8"
# base64: OSC 52 clipboard payload encoding (RFC 4648 standard alphabet)
base64 = "0.22"

# Dev
tempfile = "3"
tokio-test = "0.4"
mockall = "0.13"
serial_test = "3"
expectrl = "0.7"
insta = { version = "1.41", features = ["filters"] }
wiremock = "0.6"

# Root package (binary + lib during transition)
[package]
name = "flutter-demon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A high-performance TUI for Flutter development"

# The binary crate
[[bin]]
name = "fdemon"
path = "src/main.rs"

[dependencies]
# Internal workspace crates
fdemon-core.workspace = true
fdemon-daemon.workspace = true
fdemon-app.workspace = true
fdemon-tui.workspace = true
fdemon-dap.workspace = true

# CLI
clap.workspace = true

# Async
tokio.workspace = true

# Error handling
color-eyre.workspace = true

# Logging
tracing.workspace = true

# Headless mode dependencies
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-test.workspace = true
mockall.workspace = true
serial_test.workspace = true
expectrl.workspace = true
insta.workspace = true
regex.workspace = true
