server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Default MIME types + WASM
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    # ── Compression ──────────────────────────────────────────────────────────
    # Gzip: enabled for all compressible types including WASM (~50% savings).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/html
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/xml
        application/wasm
        application/manifest+json
        image/svg+xml;

    # Brotli: optional — only active if the ngx_brotli module is compiled in.
    # nginx:alpine does not include brotli by default; uncomment only if using
    # a brotli-enabled image (e.g. fholzer/nginx-brotli).
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types
    #     text/html text/css text/plain application/javascript
    #     application/json application/wasm image/svg+xml;

    # ── Static files that must resolve at the SITE ROOT ──────────────────────
    # Trunk's copy-dir directive copies website/public/ as dist/public/, so
    # robots.txt, sitemap.xml, and og-image.png land at /public/<file> inside
    # the nginx document root.  The aliases below expose them at the top-level
    # paths that crawlers and social scrapers expect.

    location = /robots.txt {
        alias /usr/share/nginx/html/public/robots.txt;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        alias /usr/share/nginx/html/public/sitemap.xml;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "application/xml; charset=utf-8";
    }

    location = /og-image.png {
        alias /usr/share/nginx/html/public/og-image.png;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # install.sh — the canonical installer lives at the repo root; CI copies it
    # into website/public/ before the Docker build (see release.yml and
    # publish-site.yml), so Trunk's copy-dir lands it at /public/install.sh.
    # Exposed at the root so users can `curl -fsSL https://fdemon.dev/install.sh | bash`.
    location = /install.sh {
        alias /usr/share/nginx/html/public/install.sh;
        types { }
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }

    # Binaries are NOT hosted here — they stay on GitHub Releases (CDN-backed,
    # versioned, checksummed). /download is a convenience redirect.
    location = /download {
        return 302 https://github.com/edTheGuy00/fdemon/releases/latest;
    }

    # ── Long cache for Trunk content-hashed assets ───────────────────────────
    # Trunk appends a content-hash to WASM/JS/CSS filenames when filehash=true,
    # so these files are safe to cache permanently.  The regex matches only the
    # hash-stamped filenames produced by trunk build --release.
    location ~* "-[0-9a-f]{16,}(_bg)?\.(js|wasm|css)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # ── No cache for HTML ─────────────────────────────────────────────────────
    # Per-route prerendered snapshots (dist/<route>/index.html) and the root
    # index.html must revalidate on every request so updated snapshots are
    # picked up immediately after a redeploy.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── SPA + prerender routing ───────────────────────────────────────────────
    # try_files order:
    #   1. $uri              — exact static file (WASM, JS, CSS, images, etc.)
    #   2. $uri/index.html   — prerendered snapshot for this route
    #                          (e.g. /docs/installation → dist/docs/installation/index.html)
    #   3. /index.html       — CSR SPA shell fallback for unprerendered paths
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/index.html /index.html;
    }
}
